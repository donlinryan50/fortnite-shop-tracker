name: Collect daily shop

on:
  schedule:
    - cron: "20 0 * * *"   # 00:20 UTC, just after the shop resets
  workflow_dispatch:        # gives you the "Run workflow" button

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect today's shop
        working-directory: fortnite-shop-tracker
        run: python collect.py

      - name: Commit the data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fortnite-shop-tracker/data
          git diff --staged --quiet || git commit -m "data: shop for $(date -u +%F)"
          git push
